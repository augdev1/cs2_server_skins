services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cs2_skins_backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-cs2_weaponpaints}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-cs2-weaponpaints-super-secret-key}
    ports:
      - "8000:8000"
    networks:
      - cs2_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs2_skins_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cs2_network

networks:
  cs2_network:
    driver: bridge
